quarkus.http.port=8004

# Pinned to HTTP/1.1 from the start: Payroll's build (agents/payroll) found
# that ballerina/http's client defaults to HTTP/2 cleartext prior-knowledge
# negotiation, which doesn't interop with Vert.x's h2c handling — every A2A
# operation here goes over this same plain HTTP port (REST binding), so
# this agent would hit it on every call, not just card discovery.
quarkus.http.http2=false

quarkus.langchain4j.anthropic.api-key=${ANTHROPIC_API_KEY:unset}
quarkus.langchain4j.anthropic.timeout=40000
quarkus.langchain4j.anthropic.chat-model.model-name=claude-sonnet-4-5
